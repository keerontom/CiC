<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Compound Calculator</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
  overflow: hidden;
  height: 100%;
  overscroll-behavior: none;  /* ← kills iOS bounce scroll */
  position: fixed;            /* ← the iOS-specific nuclear option */
  width: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  display: flex;
  justify-content: center;
  padding: 12px 12px 30px 12px;
  height: 100%;
  width: 100%;                /* ← needed when parent is position:fixed */
  overflow: hidden;
  overscroll-behavior: none;  /* ← belt and suspenders */
}

    .wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;          /* ← add this */
  gap: 10px;
  overflow: hidden;      /* ← add this */
}

    /* ── TABS ── */
    .tabs {
      display: flex;
      width: 100%;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #d1d5db;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn.active { background: #4a5568; color: #fff; }

    /* ── TAB PANELS ── */
    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .tab-panel.active { display: flex; }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }

    .card-header {
      background: #4a5568;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 14px;
    }

    /* ── INPUT TABLE ── */
    .input-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .input-table tr { border-bottom: 1px solid #e8e8ec; }
    .input-table tr:last-child { border-bottom: none; }

    .input-table td {
      padding: 9px 12px;
      vertical-align: middle;
      overflow: hidden;
    }

    .input-table td.label-cell {
      font-size: 15px;
      color: #1c1c1e;
      white-space: nowrap;
      width: 40%;
    }

    .label-cell .unit {
      font-size: 12px;
      color: #8e8e93;
      margin-left: 3px;
    }

    .input-table td.control-cell {
      width: 60%;
      text-align: right;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      width: 100%;
    }

    /* ── INPUT BOXES ── */
    .input-box {
      border: 1.5px solid #d1d1d6;
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 16px;
      text-align: right;
      color: #1c1c1e;
      background: #fff;
      outline: none;
      height: 36px;
      width: 100%;
      min-width: 0;
      -webkit-appearance: none;
    }

    .input-box:focus { border-color: #4a5568; }

    .input-box.medium {
      flex: 1;
      width: auto;
      min-width: 0;
    }

    select.input-box {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      text-align: right;
      text-align-last: right;
      -webkit-text-align-last: right;
      padding-right: 6px;
    }

    /* ── PLUS/MINUS TOGGLE ── */
    .pm-btn {
      width: 36px;
      min-width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1.5px solid #68d391;
      background: #f0fff4;
      font-size: 18px;
      color: #2c7a4b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pm-btn.negative {
      background: #fff0f0;
      border-color: #e57373;
      color: #c0392b;
    }

    /* ── RESULTS ── */
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-bottom: 1px solid #e8e8ec;
    }

    .result-row:last-child { border-bottom: none; }
    .result-label { font-size: 14px; color: #636366; }
    .result-value { font-size: 15px; font-weight: 600; color: #1c1c1e; }
    .result-value.highlight { color: #2c7a4b; font-size: 18px; }

    /* ── LEDGER ── */
    .ledger-wrap {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  overflow-y: auto;  /* ← change from "hidden" to "auto" */
  box-shadow: 0 1px 6px rgba(0,0,0,0.1);
  max-height: 70vh;  /* ← add this so it has a defined boundary to scroll within */
}

    .ledger-header {
      background: #4a5568;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 14px;
    }

    .ledger-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ledger-table thead tr { border-bottom: 1px solid #d1d1d6; }

    .ledger-table thead th {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    .ledger-table thead th:first-child  { text-align: left; }
    .ledger-table thead th:nth-child(2) { text-align: center; }
    .ledger-table thead th:last-child   { text-align: right; }

    .ledger-table tbody tr.row-top td {
      padding: 5px 12px 1px 12px;
      border-top: 1px solid #e8e8ec;
      font-size: 13px;
      color: #1c1c1e;
    }

    .ledger-table tbody tr.row-bot td {
      padding: 1px 12px 5px 12px;
      font-size: 13px;
      color: #1c1c1e;
    }

    .ledger-table tbody td.year-num {
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      text-align: left;
      vertical-align: middle;
    }

    .ledger-table tbody td.center-col { text-align: center; }
    .ledger-table tbody td.right-col  { text-align: right; }
    .ledger-table tbody td.right-col.ending { font-weight: 600; }

    .ledger-table tfoot tr td {
      padding: 8px 12px;
      border-top: 2px solid #4a5568;
      font-weight: 700;
      font-size: 13px;
    }

    .ledger-table tfoot td:first-child { text-align: left; color: #4a5568; }
    .ledger-table tfoot td.center-col  { text-align: center; }
    .ledger-table tfoot td.right-col   { text-align: right; }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calculator', this)">Calculator</button>
    <button class="tab-btn"        onclick="switchTab('ledger', this)">Annual Ledger</button>
  </div>

  <!-- ══════════════════════════════
       TAB: CALCULATOR
  ══════════════════════════════ -->
  <div class="tab-panel active" id="tab-calculator">

    <div class="card">
      <div class="card-header">Inputs</div>
      <table class="input-table">

        <tr>
          <td class="label-cell">Principal</td>
          <td class="control-cell">
            <div class="controls">
              <input class="input-box" id="principal" type="text" value="1,000" inputmode="decimal" />
            </div>
          </td>
        </tr>

        <tr>
          <td class="label-cell">Interest <span class="unit">%</span></td>
          <td class="control-cell">
            <div class="controls">
              <input class="input-box" id="rate" type="number" value="2.75" min="0" step="0.25" inputmode="decimal" />
            </div>
          </td>
        </tr>

        <tr>
          <td class="label-cell">Compound</td>
          <td class="control-cell">
            <div class="controls">
              <select class="input-box" id="compound">
                <option value="1">Annually</option>
                <option value="2">Semi-Annually</option>
                <option value="4">Quarterly</option>
                <option value="12">Monthly</option>
                <option value="365">Daily</option>
              </select>
            </div>
          </td>
        </tr>

        <tr>
          <td class="label-cell">Duration <span class="unit">Years</span></td>
          <td class="control-cell">
            <div class="controls">
              <input class="input-box" id="duration" type="number" value="15" min="1" step="1" inputmode="numeric" />
            </div>
          </td>
        </tr>

        <tr>
          <td class="label-cell">Additions</td>
          <td class="control-cell">
            <div class="controls">
              <button class="pm-btn" id="pm-btn">+</button>
              <input class="input-box medium" id="addition" type="text" value="50" inputmode="decimal" />
              <select class="input-box medium" id="addFreq">
                <option value="1">Ann.</option>
                <option value="2">Semi-Ann.</option>
                <option value="4">Qtrly.</option>
                <option value="12" selected>Monthly</option>
                <option value="365">Daily</option>
              </select>
            </div>
          </td>
        </tr>

        <tr>
          <td class="label-cell">Add at</td>
          <td class="control-cell">
            <div class="controls">
              <select class="input-box" id="addTiming">
                <option value="start">Start of period</option>
                <option value="end">End of period</option>
              </select>
            </div>
          </td>
        </tr>

      </table>
    </div>

    <!-- Results -->
    <div class="card">
      <div class="card-header">Results</div>
      <div class="result-row">
        <span class="result-label">Ending Balance</span>
        <span class="result-value highlight" id="res-ending">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total Interest Earned</span>
        <span class="result-value" id="res-interest">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total Additions / Subtractions</span>
        <span class="result-value" id="res-additions">—</span>
      </div>
    </div>

  </div><!-- /tab-calculator -->

  <!-- ══════════════════════════════
       TAB: ANNUAL LEDGER
  ══════════════════════════════ -->
  <div class="tab-panel" id="tab-ledger">
    <div class="ledger-wrap">
      <div class="ledger-header" id="ledger-title">— YEARS</div>
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Year</th>
            <th>Additions<br>Interest</th>
            <th>Beg. Balance<br>End. Balance</th>
          </tr>
        </thead>
        <tbody id="ledger-body">
          <tr>
            <td colspan="3" style="text-align:center;padding:16px;color:#999;font-size:13px;">
              Adjust any input to generate ledger.
            </td>
          </tr>
        </tbody>
        <tfoot id="ledger-foot"></tfoot>
      </table>
    </div>
  </div>

</div><!-- /wrapper -->

<script>
  var addSign = 1;

  function fmt(n) {
    return n.toLocaleString("en-CA", { style: "currency", currency: "CAD" });
  }

  // ── TABS ─────────────────────────────────────────────
  function switchTab(name, btn) {
    var panels = document.querySelectorAll(".tab-panel");
    for (var i = 0; i < panels.length; i++) {
      panels[i].classList.remove("active");
    }
    var btns = document.querySelectorAll(".tab-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.remove("active");
    }
    document.getElementById("tab-" + name).classList.add("active");
    btn.classList.add("active");
  }

  // ── SIGN TOGGLE ───────────────────────────────────────
  document.getElementById("pm-btn").addEventListener("click", function () {
    addSign *= -1;
    if (addSign === 1) {
      this.textContent = "+";
      this.classList.remove("negative");
    } else {
      this.textContent = "−";
      this.classList.add("negative");
    }
    calculate();
  });

  // ── FORMAT ON BLUR ONLY ───────────────────────────────
  // Guard flag prevents formatField from ever re-triggering itself
  var formatting = false;

  function formatField(id) {
    if (formatting) { return; }
    formatting = true;
    var el  = document.getElementById(id);
    var raw = el.value.replace(/,/g, "");
    var num = parseFloat(raw);
    if (!isNaN(num)) {
      el.value = num.toLocaleString("en-CA", { maximumFractionDigits: 2 });
    }
    formatting = false;
    calculate();
  }

  function getField(id) {
    return parseFloat(document.getElementById(id).value.replace(/,/g, "")) || 0;
  }

  // ── CALCULATE ─────────────────────────────────────────
 function calculate() {
  var P       = getField("principal");
  var r       = parseFloat(document.getElementById("rate").value) / 100 || 0;
  var n       = parseInt(document.getElementById("compound").value);
  var t       = parseInt(document.getElementById("duration").value) || 0;
  var pmt     = getField("addition") * addSign;
  var pmtFreq = parseInt(document.getElementById("addFreq").value);
  var timing  = document.getElementById("addTiming").value;

  if (!n || n < 1) { return; }

  // Effective rate per compounding period
  var ratePerPeriod = r / n;

  // Effective rate per PAYMENT period — correct when frequencies differ
  var effectiveRatePerPayment = Math.pow(1 + ratePerPeriod, n / pmtFreq) - 1;

  var balance        = P;
  var totalAdditions = 0;
  var totalInterest  = 0;
  var rows           = [];

  for (var year = 1; year <= t; year++) {
    var opening       = balance;
    var yearInterest  = 0;
    var yearAdditions = 0;

    // Number of payment periods within this year
    var paymentsThisYear = pmtFreq;

    for (var p = 0; p < paymentsThisYear; p++) {
      var interest;
      if (timing === "start") {
        // Payment at start of payment period, then compound
        balance       += pmt;
        yearAdditions += pmt;
        interest       = balance * effectiveRatePerPayment;
        balance       += interest;
        yearInterest  += interest;
      } else {
        // Compound first, then payment at end of payment period
        interest       = balance * effectiveRatePerPayment;
        balance       += interest;
        yearInterest  += interest;
        balance       += pmt;
        yearAdditions += pmt;
      }
    }

    totalAdditions += yearAdditions;
    totalInterest  += yearInterest;
    rows.push({
      year: year,
      opening: opening,
      yearAdditions: yearAdditions,
      yearInterest: yearInterest,
      closing: balance
    });
  }

  document.getElementById("res-ending").textContent    = fmt(balance);
  document.getElementById("res-interest").textContent  = fmt(totalInterest);
  document.getElementById("res-additions").textContent = fmt(totalAdditions);
  document.getElementById("ledger-title").textContent  = t + " YEARS";

  var tbody = document.getElementById("ledger-body");
  tbody.innerHTML = "";

  for (var k = 0; k < rows.length; k++) {
    var row   = rows[k];
    var trTop = document.createElement("tr");
    trTop.className = "row-top";
    trTop.innerHTML =
      '<td class="year-num" rowspan="2">' + row.year + '.</td>' +
      '<td class="center-col">' + fmt(row.yearAdditions) + '</td>' +
      '<td class="right-col">'  + fmt(row.opening)       + '</td>';
    var trBot = document.createElement("tr");
    trBot.className = "row-bot";
    trBot.innerHTML =
      '<td class="center-col">'       + fmt(row.yearInterest) + '</td>' +
      '<td class="right-col ending">' + fmt(row.closing)      + '</td>';
    tbody.appendChild(trTop);
    tbody.appendChild(trBot);
  }

  document.getElementById("ledger-foot").innerHTML =
    '<tr>' +
      '<td>Total</td>' +
      '<td class="center-col">' + fmt(totalAdditions + totalInterest) + '</td>' +
      '<td class="right-col">'  + fmt(balance) + '</td>' +
    '</tr>';
}

  // ── EVENT LISTENERS ───────────────────────────────────
  document.getElementById("principal").addEventListener("input", calculate);
  document.getElementById("principal").addEventListener("blur",  function() { formatField("principal"); });

  document.getElementById("addition").addEventListener("input", calculate);
  document.getElementById("addition").addEventListener("blur",  function() { formatField("addition"); });

  var otherInputs = document.querySelectorAll("input:not(#principal):not(#addition), select");
  for (var i = 0; i < otherInputs.length; i++) {
    otherInputs[i].addEventListener("input", calculate);
  }

  calculate();
</script>
</body>
</html>
